<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles\style.css" />
    <script src="scripts\script.js" defer></script>
  </head>
  <body>
    <section class="calMedia">
      <section class="cal-display">
        <button class="return" onclick="voltar()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
          <path fill-rule="evenodd" d="M7.28 7.72a.75.75 0 0 1 0 1.06l-2.47 2.47H21a.75.75 0 0 1 0 1.5H4.81l2.47 2.47a.75.75 0 1 1-1.06 1.06l-3.75-3.75a.75.75 0 0 1 0-1.06l3.75-3.75a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd" />
          </svg>
        </button>
        <h2>Calculadora de Notas</h2>
        <div class="pergunta">
          <label for="nota11">Nota 1:</label><br>
          <input type="number" id="nota11" />
        </div>
        <div class="pergunta">
          <label for="nota21">Nota 2:</label><br>
          <input type="number" id="nota21" />
        </div>
        <div class="pergunta">
          <label for="nota31">Nota 3:</label><br>
          <input type="number" id="nota31" />
        </div>
        <div class="pergunta">
          <label for="edag1">EDAG:</label><br>
          <input type="number" id="edag1" />
        </div>
        <button id="act-button" onclick="calMedia()" popovertarget="popup">Calcular a Nota</button>
        
      </section>
    </section>
    <section class="calAV3">
      <section class="cal-display">
        <button class="return" onclick="voltar()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
          <path fill-rule="evenodd" d="M7.28 7.72a.75.75 0 0 1 0 1.06l-2.47 2.47H21a.75.75 0 0 1 0 1.5H4.81l2.47 2.47a.75.75 0 1 1-1.06 1.06l-3.75-3.75a.75.75 0 0 1 0-1.06l3.75-3.75a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd" />
          </svg>
        </button>
        <h2>Calculadora de Notas</h2>
        <div class="pergunta">
          <label for="nota12">Nota 1:</label><br>
          <input type="number" id="nota12" />
        </div>
        <div class="pergunta">
          <label for="nota22">Nota 2:</label><br>
          <input type="number" id="nota22" />
        </div>
        <div class="pergunta">
          <label for="edag2">EDAG:</label><br>
          <input type="number" id="edag2" />
        </div>
        <button id="act-button" onclick="calAv3()" popovertarget="popup">Calcular a Nota</button>
      </section>
    </section>
    <section class="calFinal">
      <section class="cal-display">
        <button class="return" onclick="voltar()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
          <path fill-rule="evenodd" d="M7.28 7.72a.75.75 0 0 1 0 1.06l-2.47 2.47H21a.75.75 0 0 1 0 1.5H4.81l2.47 2.47a.75.75 0 1 1-1.06 1.06l-3.75-3.75a.75.75 0 0 1 0-1.06l3.75-3.75a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd" />
          </svg>
        </button>
        <h2>Calculadora de Notas</h2>
        <div class="pergunta">
          <label for="nota13">Nota 1:</label>
          <input type="number" id="nota13" />
        </div>
        <div class="pergunta">
          <label for="nota23">Nota 2:</label>
          <input type="number" id="nota23" />
        </div>
        <div class="pergunta">
          <label for="nota33">Nota 3:</label>
          <input type="number" id="nota33" />
        </div>
        <div class="pergunta">
          <label for="edag3">EDAG:</label>
          <input type="number" id="edag3"/>
        </div>
        <button id="act-button" onclick="calFinal()" popovertarget="popup">Calcular a Nota</button>
      </section>
    </section>
    <div class="resultado" id="popup" popover="auto">
      <h1 style="text-align: center; color: black;">Resultado:</h1>
      <h2 id="resultado"></h2>        
    </div>
    <section class="seletor">
      <h1>Selecione o tipo de cálculo:</h1>
      <div>
        <button id="calMedia" onclick="mostrarCalMedia()">Calcular a Média</button>
        <button id="calAV3" onclick="mostrarCalAV3()">Calcular a nota da AV3</button>
        <button id="calFinal" onclick="mostrarCalFinal()">Calcular a nota da Final</button>
      </div>
    </section>
  </body>
</html>
