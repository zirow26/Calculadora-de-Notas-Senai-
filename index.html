<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles\style.css" />
    <script src="scripts\script.js" defer></script>
  </head>
  <body>
    <section class="formulario">
      <h2>Calculadora de Notas</h2>
      <div class="pergunta">
        <label for="nota1">Nota 1:</label><br>
        <input type="number" id="nota1" />
      </div>
      <div class="pergunta">
        <label for="nota2">Nota 2:</label><br>
        <input type="number" id="nota2" />
      </div>
      <div class="pergunta">
        <label for="nota3">Nota 3:</label><br>
        <input type="number" id="nota3" />
      </div>
      <div class="pergunta">
        <label for="edag">EDAG:</label><br>
        <input type="number" id="edag" />
      </div>
      <button id="act-button" onclick="cal()" popovertarget="popup">Calcular a Nota</button>
    </section>
    <div class="resultado" id="popup" popover="auto">
      <h2 id="resultado"></h2>        
    </div>
  </body>
</html>
